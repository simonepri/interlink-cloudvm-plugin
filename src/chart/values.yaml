image:
  repository: ghcr.io/simonepri/interlink-cloudvm-plugin
  pullPolicy: IfNotPresent
  tag: ""

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

# Callers of the NodeClaim API (/v1/nodeclaims, /v1/catalog): a bearer service account token for this audience that a
# TokenReview accepts, from one of these users, such as system:serviceaccount:karpenter:cloudvm-karpenter. With no
# users every call is refused.
nodeClaimAPI:
  audience: "cloudvm-plugin"
  allowedUsers: []

provider:
  type: "mock"  # "aws" | "gcp" | "mock"
  clusterTag: "interlink-cloudvm"
  awsRegion: "us-east-1"
  awsRegions: []
  # Region each virtual node's pods launch in, keyed by node name; a cloudvm.vk.io/region annotation overrides it.
  nodeRegions: {}
  # EKS cluster whose Pod Identity associations give pods their IAM role credentials,
  # and its region (default awsRegion).
  eksClusterName: ""
  eksClusterRegion: ""
  # IAM role the plugin assumes with its own credentials for every AWS call except the pod token exchange, such as a
  # role in the account that hosts the workers; empty keeps every call on the plugin's own credentials.
  awsRoleArn: ""
  awsLaunchTemplateId: ""
  awsLaunchTemplateName: ""
  awsSubnetId: ""
  awsSecurityGroupId: ""
  gcpProject: ""
  gcpZone: "us-central1-a"
  tickerURL: ""
  idleGracePeriod: "60s"
  # Idle VMs older than this are terminated instead of reused ("0" disables the limit).
  reuseMaxVMAge: "24h"
  # How long an idle VM's reverse tunnel may stay down before the VM is terminated instead of reused.
  reuseTunnelDownGrace: "30s"
  # Fraction by which an idle spot VM's zone price may exceed the cheapest zone of its region before it is terminated
  # instead of reused, such as "0.2"; empty disables the check. Needs the embedded spot ticker (ENABLE_TICKER).
  reuseMaxPricePremium: ""
  reconcileIntervalSeconds: 60
  reconcileLaunchGraceSeconds: 120
  # EC2 launch calls per second and burst per region, and the SDK retry quota; empty keeps the defaults (4, 20, 2500).
  awsLaunchRate: ""
  awsLaunchBurst: ""
  awsRetryQuota: ""

database:
  url: ""
  existingSecret: ""

# Reverse tunnel: aws/gcp workers dial back to the plugin instead of the plugin reaching their private IPs.
tunnel:
  port: 7443
  endpoint: ""  # host:port tailnet and router workers dial; required with provider aws or gcp
  connectTimeout: "10m"
  directFallback: false  # Also try the worker's private IP for same-VPC workers
  tailscaleTags: "tag:clvm-worker"
  authKeySecret:
    name: ""
    key: TAILSCALE_AUTHKEY

registryMirrors: []
otelEndpoint: ""
# OTLP/HTTP collector URL that receives worker bootstrap, runner, and container logs; empty disables forwarding.
otlpLogsEndpoint: ""
# OTLP/HTTP collector URL that receives the plugin and node agent lifecycle traces; empty disables tracing.
otlpTracesEndpoint: ""
nodeProblemDetector:
  enabled: false
# Pulls eStargz images lazily through the stargz snapshotter on workers; false pulls every image in full.
lazyImagePulls: true
customBootstrapScript: ""
# Runs the pinned parca-agent on every tunnel worker; workers upload through the tunnel, and the plugin forwards their
# profiles to this Parca gRPC server with the token, which never reaches a worker.
profiling:
  endpoint: ""  # host:port of the Parca server; empty leaves workers unprofiled
  insecure: false  # plaintext gRPC instead of TLS
  tokenSecret:
    name: ""  # Secret holding the Parca bearer token; empty sends no token
    key: token
  # parca-agent config written for the in-cluster agent's __meta_kubernetes_* labels, such as its relabel_configs.
  agentConfig: ""
  # Extra parca-agent flags, such as --off-cpu-threshold=0.001 or --metadata-external-labels=cluster=<name>.
  agentArgs: []

service:
  type: ClusterIP
  port: 4040

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}

persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 1Gi
  mountPath: /var/lib/cloudvm

rbac:
  create: true
  clusterWide: true  # Set to false to restrict secret reading to tenantNamespaces
  tenantNamespaces: []  # e.g. ["default", "ml-workloads"] when clusterWide is false

# CloudVM node agent: shards that register one Node per NodeClaim VM, keep it Ready, and run its pods.
nodeAgent:
  enabled: false
  # Number of StatefulSet shards; each serves the Nodes whose names hash to it.
  shards: 2
  # Port of the kubelet API (logs) every served Node advertises.
  kubeletPort: 10250
  # Secret of type kubernetes.io/tls with the kubelet API serving certificate; it replaces servingCert when set.
  servingCertSecret: ""
  # Kubelet API serving certificate the cluster signs for each shard's pod IP, which the API server verifies.
  servingCert:
    # CertificateSigningRequest signer: beta.eks.amazonaws.com/app-serving on EKS, kubernetes.io/kubelet-serving where
    # kube-controller-manager signs kubelet serving certificates; empty serves a self-signed certificate.
    signerName: beta.eks.amazonaws.com/app-serving
    # Lifetime each request asks for and the longest the approver approves; the agent renews at 70 to 90 percent of it.
    duration: 24h
    # The approver Deployment, which approves only the shards' requests for their own pod IP.
    approver:
      resources:
        limits:
          memory: 128Mi
        requests:
          cpu: 10m
          memory: 32Mi
  # Extra environment, such as CLAIM_POLL_INTERVAL, POD_STATUS_INTERVAL or LEASE_RENEW_INTERVAL.
  env: []
  resources:
    limits:
      memory: 1Gi
    requests:
      cpu: 200m
      memory: 256Mi
