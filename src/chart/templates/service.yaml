apiVersion: v1
kind: Service
metadata:
  name: {{ include "interlink-cloudvm-plugin.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "interlink-cloudvm-plugin.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.tunnel.port }}
      targetPort: tunnel
      protocol: TCP
      name: tunnel
  selector:
    app.kubernetes.io/name: {{ include "interlink-cloudvm-plugin.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
