{{- $isPostgres := false }}
{{- if or (and .Values.database .Values.database.url) (and .Values.database .Values.database.existingSecret) }}
{{- $isPostgres = true }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "interlink-cloudvm-plugin.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "interlink-cloudvm-plugin.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount | default (ternary 2 1 $isPostgres) }}
  strategy:
    type: {{ ternary "RollingUpdate" "Recreate" $isPostgres }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "interlink-cloudvm-plugin.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "interlink-cloudvm-plugin.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ include "interlink-cloudvm-plugin.serviceAccountName" . }}
      containers:
        - name: provider
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: PORT
              value: "{{ .Values.service.port }}"
            - name: PROVIDER_TYPE
              value: "{{ .Values.provider.type }}"
            - name: CLUSTER_TAG
              value: "{{ .Values.provider.clusterTag }}"
            - name: AWS_REGION
              value: "{{ .Values.provider.awsRegion }}"
            - name: AWS_REGIONS
              value: "{{ join "," .Values.provider.awsRegions | default .Values.provider.awsRegion }}"
            {{- with .Values.provider.eksClusterName }}
            - name: EKS_CLUSTER_NAME
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.provider.eksClusterRegion }}
            - name: EKS_CLUSTER_REGION
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.provider.nodeRegions }}
            - name: NODE_REGIONS
              value: {{ toJson . | quote }}
            {{- end }}
            - name: RECONCILE_LAUNCH_GRACE_SECONDS
              value: "{{ .Values.provider.reconcileLaunchGraceSeconds | default 120 }}"
            {{- with .Values.provider.awsLaunchRate }}
            - name: AWS_LAUNCH_RATE
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.provider.awsLaunchBurst }}
            - name: AWS_LAUNCH_BURST
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.provider.awsRetryQuota }}
            - name: AWS_RETRY_QUOTA
              value: {{ . | quote }}
            {{- end }}
            - name: REGION_STORE_PATH
              value: "{{ .Values.persistence.mountPath | default "/var/lib/cloudvm" }}/instance-regions.json"
            - name: GCP_PROJECT
              value: "{{ .Values.provider.gcpProject }}"
            - name: GCP_ZONE
              value: "{{ .Values.provider.gcpZone }}"
            - name: RECONCILE_INTERVAL_SECONDS
              value: "{{ .Values.provider.reconcileIntervalSeconds }}"
            - name: TICKER_URL
              value: "{{ .Values.provider.tickerURL }}"
            - name: AWS_LAUNCH_TEMPLATE_ID
              value: "{{ .Values.provider.awsLaunchTemplateId }}"
            - name: AWS_LAUNCH_TEMPLATE_NAME
              value: "{{ .Values.provider.awsLaunchTemplateName }}"
            {{- if .Values.provider.idleGracePeriod }}
            - name: IDLE_GRACE_PERIOD
              value: "{{ .Values.provider.idleGracePeriod }}"
            {{- end }}
            {{- if .Values.provider.reuseMaxVMAge }}
            - name: REUSE_MAX_VM_AGE
              value: "{{ .Values.provider.reuseMaxVMAge }}"
            {{- end }}
            {{- if .Values.provider.reuseMaxPricePremium }}
            - name: REUSE_MAX_PRICE_PREMIUM
              value: "{{ .Values.provider.reuseMaxPricePremium }}"
            {{- end }}
            {{- if .Values.provider.kmsKeyId }}
            - name: KMS_KEY_ID
              value: "{{ .Values.provider.kmsKeyId }}"
            {{- end }}
            - name: TOKEN_STORE_PATH
              value: "{{ .Values.persistence.mountPath | default "/var/lib/cloudvm" }}/tokens.json"
            - name: COMPLETED_STORE_PATH
              value: "{{ .Values.persistence.mountPath | default "/var/lib/cloudvm" }}/completed-pods.json"
            - name: TOMBSTONE_STORE_PATH
              value: "{{ .Values.persistence.mountPath | default "/var/lib/cloudvm" }}/tombstones.json"
            {{- if and .Values.database .Values.database.url }}
            - name: DATABASE_URL
              value: {{ .Values.database.url | quote }}
            {{- else if and .Values.database .Values.database.existingSecret }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.secretKey | default "DATABASE_URL" }}
            {{- end }}
            - name: TUNNEL_GATEWAY_LISTEN
              value: ":{{ .Values.tunnel.port }}"
            {{- if .Values.tunnel.endpoint }}
            - name: TUNNEL_ENDPOINT
              value: {{ .Values.tunnel.endpoint | quote }}
            {{- end }}
            - name: TUNNEL_CONNECT_TIMEOUT
              value: {{ .Values.tunnel.connectTimeout | quote }}
            - name: RUNNER_DIRECT_FALLBACK
              value: "{{ .Values.tunnel.directFallback }}"
            - name: TAILSCALE_TAGS
              value: {{ .Values.tunnel.tailscaleTags | quote }}
            {{- if .Values.tunnel.authKeySecret.name }}
            - name: TAILSCALE_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.tunnel.authKeySecret.name }}
                  key: {{ .Values.tunnel.authKeySecret.key }}
            {{- end }}
            {{- if .Values.registryMirrors }}
            - name: REGISTRY_MIRRORS
              value: {{ join "," .Values.registryMirrors | quote }}
            {{- end }}
            {{- if .Values.otelEndpoint }}
            - name: OTEL_ENDPOINT
              value: {{ .Values.otelEndpoint | quote }}
            {{- end }}
            {{- if .Values.otlpLogsEndpoint }}
            - name: CLOUDVM_OTLP_LOGS_ENDPOINT
              value: {{ .Values.otlpLogsEndpoint | quote }}
            {{- end }}
            {{- if and .Values.nodeProblemDetector .Values.nodeProblemDetector.enabled }}
            - name: ENABLE_NPD
              value: "true"
            {{- end }}
            {{- if .Values.customBootstrapScript }}
            - name: CUSTOM_BOOTSTRAP_SCRIPT
              value: {{ .Values.customBootstrapScript | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            - name: tunnel
              containerPort: {{ .Values.tunnel.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath | default "/var/lib/cloudvm" }}
      volumes:
        - name: data
        {{- if and .Values.persistence.enabled (not $isPostgres) }}
          persistentVolumeClaim:
            claimName: {{ include "interlink-cloudvm-plugin.fullname" . }}-data
        {{- else }}
          emptyDir: {}
        {{- end }}
