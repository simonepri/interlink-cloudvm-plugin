{{- /* Holds the parca-agent config the plugin turns into the config every profiled worker boots with. */ -}}
{{- if and .Values.profiling.endpoint .Values.profiling.agentConfig }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "interlink-cloudvm-plugin.fullname" . }}-profiling
  labels:
    app.kubernetes.io/name: {{ include "interlink-cloudvm-plugin.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  parca-agent.yaml: {{ .Values.profiling.agentConfig | quote }}
{{- end }}
