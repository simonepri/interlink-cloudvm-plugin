{{- if and .Values.serviceAccount.create .Values.rbac.create -}}
{{- if .Values.rbac.clusterWide }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "interlink-cloudvm-plugin.serviceAccountName" . }}
  labels:
    app.kubernetes.io/name: {{ include "interlink-cloudvm-plugin.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
  # Reads the ConfigMaps and ServiceAccounts a pod's environment and volumes name, as the kubelet does.
  - apiGroups: [""]
    resources: ["configmaps", "serviceaccounts"]
    verbs: ["get"]
  # Reads the topology.kubernetes.io/region label of the node each pod is bound to.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  # Mints the projected service account tokens of the pods it runs, including those it exchanges for IAM role credentials.
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    verbs: ["create"]
  # Verifies the service account tokens of NodeClaim API callers.
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  # Reads the API server address that every container gets in KUBERNETES_SERVICE_HOST.
  - apiGroups: [""]
    resources: ["services"]
    resourceNames: ["kubernetes"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "interlink-cloudvm-plugin.serviceAccountName" . }}
  labels:
    app.kubernetes.io/name: {{ include "interlink-cloudvm-plugin.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "interlink-cloudvm-plugin.serviceAccountName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "interlink-cloudvm-plugin.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- else }}
# Nodes, token reviews and the default/kubernetes Service lie outside the tenant namespaces, so they need a ClusterRole
# even when the other rules stay namespaced.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "interlink-cloudvm-plugin.serviceAccountName" . }}-nodes
  labels:
    app.kubernetes.io/name: {{ include "interlink-cloudvm-plugin.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  # Verifies the service account tokens of NodeClaim API callers.
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  # Reads the API server address that every container gets in KUBERNETES_SERVICE_HOST.
  - apiGroups: [""]
    resources: ["services"]
    resourceNames: ["kubernetes"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "interlink-cloudvm-plugin.serviceAccountName" . }}-nodes
  labels:
    app.kubernetes.io/name: {{ include "interlink-cloudvm-plugin.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "interlink-cloudvm-plugin.serviceAccountName" . }}-nodes
subjects:
  - kind: ServiceAccount
    name: {{ include "interlink-cloudvm-plugin.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
{{- $saName := include "interlink-cloudvm-plugin.serviceAccountName" . -}}
{{- $relName := .Release.Name -}}
{{- $relNs := .Release.Namespace -}}
{{- range .Values.rbac.tenantNamespaces }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $saName }}
  namespace: {{ . }}
  labels:
    app.kubernetes.io/name: interlink-cloudvm-plugin
    app.kubernetes.io/instance: {{ $relName }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
  # Reads the ConfigMaps and ServiceAccounts a pod's environment and volumes name, as the kubelet does.
  - apiGroups: [""]
    resources: ["configmaps", "serviceaccounts"]
    verbs: ["get"]
  # Mints the projected service account tokens of the pods it runs, including those it exchanges for IAM role credentials.
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $saName }}
  namespace: {{ . }}
  labels:
    app.kubernetes.io/name: interlink-cloudvm-plugin
    app.kubernetes.io/instance: {{ $relName }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $saName }}
subjects:
  - kind: ServiceAccount
    name: {{ $saName }}
    namespace: {{ $relNs }}
---
{{- end }}
{{- end }}
{{- end }}
