# Default values of the CloudVM Karpenter controller chart; plugin.url is required.

image:
  repository: ghcr.io/simonepri/interlink-cloudvm-plugin/karpenter
  # tag defaults to the chart appVersion.
  tag: ""
  # digest pins the image; it takes precedence over tag.
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

replicas: 2

serviceAccount:
  create: true
  name: ""
  annotations: {}

plugin:
  # url is the base URL of the plugin's NodeClaim API, such as http://cloudvm-plugin.cloudvm.svc:4040.
  url: ""
  # The controller authenticates to the plugin with a projected service account token bound to this audience.
  # The plugin must use the same audience (its nodeClaimAPI.audience, NODECLAIM_API_AUDIENCE) and list this
  # release's service account in NODECLAIM_API_ALLOWED_USERS (its nodeClaimAPI.allowedUsers) as
  # system:serviceaccount:<release namespace>:<service account name>; the plugin refuses every call otherwise.
  tokenAudience: cloudvm-plugin
  # tokenExpirationSeconds is the token lifetime; the kubelet refreshes it at 80% and the controller re-reads it.
  tokenExpirationSeconds: 3600

# leaderElectionName must differ from the other Karpenter controller's lease (karpenter-leader-election) when
# both run in one namespace.
leaderElectionName: cloudvm-karpenter-leader-election

logLevel: info

# OTLP/HTTP collector URL that receives the NodeClaims' Karpenter stages as traces; empty disables tracing.
otlpTracesEndpoint: ""

# Karpenter core settings, passed through as environment variables; empty keeps the core default.
karpenter:
  featureGates: ""
  batchMaxDuration: 10s
  batchIdleDuration: 1s
  kubeClientQPS: 200
  kubeClientBurst: 300

# Provider configuration, rendered into the controller's config file.
config:
  # gpuClasses maps catalog GPU models to the gpu-class label value, matching the cluster's GPU classes;
  # memoryGB pins a class to one GPU memory size.
  gpuClasses: []
  # - class: a100-80gb
  #   models: [a100]
  #   memoryGB: 80
  # - class: l4
  #   models: [l4]
  # transferCost adds each offering's data transfer with the cluster's home region to its price, so Karpenter ranks
  # and consolidates offerings with it. The plugin's catalog gives the USD per GB rates between each region and the
  # home region (its transferCost values). Per VM, an offering adds imagePullGB at the home region's rate, spread over
  # expectedLifetime, plus homeTransmitGBPerHour at its own region's rate and homeReceiveGBPerHour at the home
  # region's. A nodePools entry replaces default for that NodePool. Once the plugin has measured minMeasuredVMs VMs
  # of a NodePool outside the home region, their image pulls and steady traffic replace the configured ones, and the
  # measured lifetime of finished VMs applies when expectedLifetime is unset (else 4h).
  transferCost:
    default:
      imagePullGB: 0
      homeTransmitGBPerHour: 0
      homeReceiveGBPerHour: 0
    nodePools: {}
    #   cloudvm-gpu:
    #     imagePullGB: 40
    #     expectedLifetime: 6h
    #     homeTransmitGBPerHour: 1
    minMeasuredVMs: 5
  # priceCap bounds the offering prices a NodePool considers, dropping offerings exceeding either cap form before
  # Karpenter sees them. A nodePools entry replaces default for that NodePool. Two forms are supported:
  # - maxPricePerGPUHour: an absolute dollar limit on an offering's price per GPU-hour.
  # - maxPriceAboveCheapestPercent: a relative cap above the cheapest offering of the same GPU class and capacity
  #   type in the NodePool's footprint. The reference price is the cheapest offering price per GPU-hour (including
  #   transfer cost) for that GPU class and capacity type across the NodePool's footprint.
  # Offerings are compared against the computed price (base price + data transfer cost). Price cap is off by default.
  priceCap:
    default: {}
    #   maxPricePerGPUHour: 2.50
    #   maxPriceAboveCheapestPercent: 20
    nodePools: {}
    #   cloudvm-gpu:
    #     maxPricePerGPUHour: 3.00
    #     maxPriceAboveCheapestPercent: 25
  # nodePoolSelector limits this controller to CloudVM NodePools with these labels; empty serves them all.
  nodePoolSelector: {}
  # offeringSpread lets each claim of a scale-up launch with one of the maxOfferings cheapest compatible offerings
  # priced within priceTolerance (a fraction) of the cheapest, chosen by the claim's name, so a batch probes several
  # regions for capacity at once; a claim may cost up to priceTolerance more. maxOfferings: 1 turns spreading off.
  offeringSpread:
    priceTolerance: 0.10
    maxOfferings: 4
  # launchFallback makes one launch try the claim's next offering after the cloud refuses one for lack of capacity or
  # quota, up to maxAttempts offerings and while less than timeout has passed, before Karpenter hears of the shortage.
  launchFallback:
    maxAttempts: 3
    timeout: 60s
  catalogTTL: 60s
  catalogMaxStaleness: 15m
  unavailableOfferingTTL: 3m
  # quotaExceededTTL is how long an offering stays unavailable after a cloud quota refused it.
  quotaExceededTTL: 10m
  maxPods: 110
  ephemeralStorage: 100Gi

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    memory: 1Gi

podAnnotations: {}
podLabels: {}
priorityClassName: ""
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

metrics:
  port: 8080
healthProbe:
  port: 8081
