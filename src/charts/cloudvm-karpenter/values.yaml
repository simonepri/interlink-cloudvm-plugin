# Default values of the CloudVM Karpenter controller chart; plugin.url is required.

image:
  repository: ghcr.io/simonepri/interlink-cloudvm-plugin/karpenter
  # tag defaults to the chart appVersion.
  tag: ""
  # digest pins the image; it takes precedence over tag.
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

replicas: 2

serviceAccount:
  create: true
  name: ""
  annotations: {}

plugin:
  # url is the base URL of the plugin's NodeClaim API, such as http://cloudvm-plugin.cloudvm.svc:4040.
  url: ""
  # The controller authenticates to the plugin with a projected service account token bound to this audience.
  # The plugin must use the same audience (its nodeClaimAPI.audience, NODECLAIM_API_AUDIENCE) and list this
  # release's service account in NODECLAIM_API_ALLOWED_USERS (its nodeClaimAPI.allowedUsers) as
  # system:serviceaccount:<release namespace>:<service account name>; the plugin refuses every call otherwise.
  tokenAudience: cloudvm-plugin
  # tokenExpirationSeconds is the token lifetime; the kubelet refreshes it at 80% and the controller re-reads it.
  tokenExpirationSeconds: 3600

# leaderElectionName must differ from the other Karpenter controller's lease (karpenter-leader-election) when
# both run in one namespace.
leaderElectionName: cloudvm-karpenter-leader-election

logLevel: info

# OTLP/HTTP collector URL that receives the NodeClaims' Karpenter stages as traces; empty disables tracing.
otlpTracesEndpoint: ""

# Karpenter core settings, passed through as environment variables; empty keeps the core default.
karpenter:
  featureGates: ""
  batchMaxDuration: 10s
  batchIdleDuration: 1s
  kubeClientQPS: 200
  kubeClientBurst: 300

# Provider configuration, rendered into the controller's config file.
config:
  # gpuClasses maps catalog GPU models to the gpu-class label value, matching the cluster's GPU classes;
  # memoryGB pins a class to one GPU memory size.
  gpuClasses: []
  # - class: a100-80gb
  #   models: [a100]
  #   memoryGB: 80
  # - class: l4
  #   models: [l4]
  # dataCost adds a per-hour cost to offerings outside homeRegion.
  dataCost: {}
  #   homeRegion: us-east-1
  #   defaultUSDPerHour: 0.0
  #   perRegionUSDPerHour:
  #     eu-west-1: 0.05
  # nodePoolSelector limits this controller to CloudVM NodePools with these labels; empty serves them all.
  nodePoolSelector: {}
  # offeringSpread lets each claim of a scale-up launch with one of the maxOfferings cheapest compatible offerings
  # priced within priceTolerance (a fraction) of the cheapest, chosen by the claim's name, so a batch probes several
  # regions for capacity at once; a claim may cost up to priceTolerance more. maxOfferings: 1 turns spreading off.
  offeringSpread:
    priceTolerance: 0.10
    maxOfferings: 4
  catalogTTL: 60s
  catalogMaxStaleness: 15m
  unavailableOfferingTTL: 3m
  maxPods: 110
  ephemeralStorage: 100Gi

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    memory: 1Gi

podAnnotations: {}
podLabels: {}
priorityClassName: ""
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

metrics:
  port: 8080
healthProbe:
  port: 8081
