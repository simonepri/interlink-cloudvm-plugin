{{/* Controller Deployment: Karpenter core settings as environment, the provider config file, and its own lease. */}}
{{- if not .Values.plugin.url }}
{{- fail "plugin.url is required: set it to the plugin's NodeClaim API base URL" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cloudvm-karpenter.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cloudvm-karpenter.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  revisionHistoryLimit: 5
  strategy:
    rollingUpdate:
      maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "cloudvm-karpenter.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cloudvm-karpenter.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "cloudvm-karpenter.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: {{ include "cloudvm-karpenter.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop: ["ALL"]
          env:
            - name: CLOUDVM_PLUGIN_URL
              value: {{ .Values.plugin.url | quote }}
            - name: CLOUDVM_CONFIG_PATH
              value: /etc/cloudvm-karpenter/config.yaml
            - name: LEADER_ELECTION_NAME
              value: {{ .Values.leaderElectionName | quote }}
            - name: LEADER_ELECTION_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            - name: METRICS_PORT
              value: {{ .Values.metrics.port | quote }}
            - name: HEALTH_PROBE_PORT
              value: {{ .Values.healthProbe.port | quote }}
            - name: BATCH_MAX_DURATION
              value: {{ .Values.karpenter.batchMaxDuration | quote }}
            - name: BATCH_IDLE_DURATION
              value: {{ .Values.karpenter.batchIdleDuration | quote }}
            - name: KUBE_CLIENT_QPS
              value: {{ .Values.karpenter.kubeClientQPS | quote }}
            - name: KUBE_CLIENT_BURST
              value: {{ .Values.karpenter.kubeClientBurst | quote }}
            {{- with .Values.karpenter.featureGates }}
            - name: FEATURE_GATES
              value: {{ . | quote }}
            {{- end }}
            - name: MEMORY_LIMIT
              valueFrom:
                resourceFieldRef:
                  containerName: controller
                  divisor: "0"
                  resource: limits.memory
            - name: CPU_REQUESTS
              valueFrom:
                resourceFieldRef:
                  containerName: controller
                  divisor: 1m
                  resource: requests.cpu
          ports:
            - name: http-metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            - name: http
              containerPort: {{ .Values.healthProbe.port }}
              protocol: TCP
          livenessProbe:
            initialDelaySeconds: 30
            timeoutSeconds: 30
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            initialDelaySeconds: 5
            timeoutSeconds: 30
            httpGet:
              path: /readyz
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/cloudvm-karpenter
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ include "cloudvm-karpenter.fullname" . }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
