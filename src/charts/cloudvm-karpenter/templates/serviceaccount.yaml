{{/* Service account the controller runs as. */}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cloudvm-karpenter.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cloudvm-karpenter.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
