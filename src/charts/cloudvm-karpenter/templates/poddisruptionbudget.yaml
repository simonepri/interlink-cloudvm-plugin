{{/* Keeps one controller replica available during voluntary disruptions. */}}
{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "cloudvm-karpenter.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cloudvm-karpenter.labels" . | nindent 4 }}
spec:
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "cloudvm-karpenter.selectorLabels" . | nindent 6 }}
{{- end }}
