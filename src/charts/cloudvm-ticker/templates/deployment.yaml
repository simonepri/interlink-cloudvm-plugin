apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cloudvm-ticker.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "cloudvm-ticker.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "cloudvm-ticker.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "cloudvm-ticker.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ include "cloudvm-ticker.serviceAccountName" . }}
      containers:
        - name: ticker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: SERVICE_MODE
              value: "ticker"
            - name: PORT
              value: "{{ .Values.service.port }}"
            - name: SCRAPE_INTERVAL_SECONDS
              value: "{{ .Values.ticker.scrapeIntervalSeconds }}"
            - name: TICKER_REGIONS
              value: "{{ join "," .Values.ticker.regions }}"
            - name: TICKER_INSTANCE_TYPES
              value: "{{ join "," .Values.ticker.instanceTypes }}"
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
